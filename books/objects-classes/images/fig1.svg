<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-labelledby="title">
	<title id="title">Two [[Prototype]] chains for class Guest extends Student</title>
	<style>
		.box { fill: #eef2f6; stroke: #1a2330; stroke-width: 2.4; }
		.t { font: 600 14px ui-monospace, "IBM Plex Mono", monospace; fill: #1a2330; }
		.s { font: 500 12px ui-monospace, "IBM Plex Mono", monospace; fill: #536274; }
		.a { stroke: #1a2330; stroke-width: 2.2; fill: none; marker-end: url(#arr-oc); }
	</style>
	<defs>
		<marker id="arr-oc" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
			<path d="M0,0 L8,4 L0,8 Z" fill="#1a2330"/>
		</marker>
	</defs>
	<rect width="720" height="400" fill="#eef2f6"/>

	<text class="s" x="24" y="28">function objects (statics)</text>
	<rect class="box" x="40" y="40" width="180" height="56" rx="2"/>
	<text class="t" x="56" y="66">Guest</text>
	<text class="s" x="56" y="84">the constructor</text>
	<rect class="box" x="400" y="40" width="180" height="56" rx="2"/>
	<text class="t" x="416" y="66">Student</text>
	<text class="s" x="416" y="84">the constructor</text>
	<line class="a" x1="220" y1="68" x2="392" y2="68"/>
	<text class="s" x="248" y="60">[[Prototype]]</text>

	<text class="s" x="24" y="148">prototype objects (instance methods)</text>
	<rect class="box" x="40" y="160" width="220" height="56" rx="2"/>
	<text class="t" x="56" y="186">Guest.prototype</text>
	<text class="s" x="56" y="204">visit, constructor</text>
	<rect class="box" x="400" y="160" width="240" height="56" rx="2"/>
	<text class="t" x="416" y="186">Student.prototype</text>
	<text class="s" x="416" y="204">print, constructor</text>
	<line class="a" x1="260" y1="188" x2="392" y2="188"/>
	<text class="s" x="268" y="180">[[Prototype]]</text>

	<line class="a" x1="130" y1="96" x2="130" y2="152"/>
	<text class="s" x="138" y="128">.prototype</text>
	<line class="a" x1="490" y1="96" x2="490" y2="152"/>
	<text class="s" x="498" y="128">.prototype</text>

	<rect class="box" x="40" y="300" width="180" height="56" rx="2"/>
	<text class="t" x="56" y="326">kyle</text>
	<text class="s" x="56" y="344">the instance</text>
	<line class="a" x1="130" y1="300" x2="130" y2="224"/>
	<text class="s" x="138" y="268">[[Prototype]]</text>

	<text class="s" x="280" y="380">class Guest extends Student writes both arrows.</text>
</svg>
