<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img" aria-labelledby="title">
	<title id="title">One event-loop turn: task, then jobs, then paint</title>
	<style>
		.box { fill: #eef2f6; stroke: #1a2330; stroke-width: 2.4; }
		.t { font: 600 14px ui-monospace, "IBM Plex Mono", monospace; fill: #1a2330; }
		.s { font: 500 12px ui-monospace, "IBM Plex Mono", monospace; fill: #536274; }
		.a { stroke: #1a2330; stroke-width: 2.2; fill: none; marker-end: url(#arr-el); }
	</style>
	<defs>
		<marker id="arr-el" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
			<path d="M0,0 L8,4 L0,8 Z" fill="#1a2330"/>
		</marker>
	</defs>
	<rect width="720" height="300" fill="#eef2f6"/>

	<rect class="box" x="24" y="28" width="200" height="88" rx="2"/>
	<text class="t" x="40" y="58">1. Task</text>
	<text class="s" x="40" y="80">timer, I/O, click</text>
	<text class="s" x="40" y="98">script, message</text>
	<line class="a" x1="224" y1="72" x2="268" y2="72"/>

	<rect class="box" x="276" y="28" width="200" height="88" rx="2"/>
	<text class="t" x="292" y="58">2. Jobs</text>
	<text class="s" x="292" y="80">drain microtasks</text>
	<text class="s" x="292" y="98">to empty</text>
	<line class="a" x1="476" y1="72" x2="520" y2="72"/>

	<rect class="box" x="528" y="28" width="168" height="88" rx="2"/>
	<text class="t" x="544" y="58">3. Render?</text>
	<text class="s" x="544" y="80">host may paint</text>
	<text class="s" x="544" y="98">then next task</text>

	<rect class="box" x="24" y="148" width="328" height="112" rx="2"/>
	<text class="t" x="40" y="176">task queue</text>
	<text class="s" x="40" y="200">setTimeout  -&gt;  fetch callback</text>
	<text class="s" x="40" y="218">UI event  -&gt;  postMessage</text>
	<text class="s" x="40" y="240">one of these = one turn</text>

	<rect class="box" x="368" y="148" width="328" height="112" rx="2"/>
	<text class="t" x="384" y="176">job queue</text>
	<text class="s" x="384" y="200">Promise.then / catch / finally</text>
	<text class="s" x="384" y="218">queueMicrotask</text>
	<text class="s" x="384" y="240">a job can enqueue another job</text>
</svg>
