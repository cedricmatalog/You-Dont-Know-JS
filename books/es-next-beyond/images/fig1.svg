<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-labelledby="title">
	<title id="title">Temporal types: calendar values versus timeline values</title>
	<style>
		.box { fill: #eef2f6; stroke: #1a2330; stroke-width: 2.4; }
		.t { font: 600 13px ui-monospace, "IBM Plex Mono", monospace; fill: #1a2330; }
		.s { font: 500 12px ui-monospace, "IBM Plex Mono", monospace; fill: #536274; }
		.a { stroke: #1a2330; stroke-width: 2.2; fill: none; marker-end: url(#arr-t); }
		.lossy { stroke: #1a2330; stroke-width: 2.2; stroke-dasharray: 6 5; fill: none; marker-end: url(#arr-t); }
	</style>
	<defs>
		<marker id="arr-t" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
			<path d="M0,0 L8,4 L0,8 Z" fill="#1a2330"/>
		</marker>
	</defs>
	<rect width="720" height="400" fill="#eef2f6"/>

	<text class="s" x="24" y="24">calendar (no timeline)</text>
	<rect class="box" x="24" y="36" width="158" height="44" rx="2"/>
	<text class="t" x="36" y="64">PlainYearMonth</text>
	<rect class="box" x="194" y="36" width="158" height="44" rx="2"/>
	<text class="t" x="206" y="64">PlainMonthDay</text>
	<rect class="box" x="364" y="36" width="140" height="44" rx="2"/>
	<text class="t" x="384" y="64">PlainDate</text>
	<rect class="box" x="516" y="36" width="180" height="44" rx="2"/>
	<text class="t" x="548" y="64">PlainTime</text>

	<rect class="box" x="248" y="132" width="168" height="48" rx="2"/>
	<text class="t" x="264" y="162">PlainDateTime</text>
	<line class="a" x1="434" y1="80" x2="340" y2="132"/>
	<line class="a" x1="606" y1="80" x2="400" y2="132"/>
	<text class="s" x="448" y="112">+ time / + date</text>

	<text class="s" x="24" y="212">timeline</text>
	<rect class="box" x="196" y="224" width="248" height="56" rx="2"/>
	<text class="t" x="212" y="248">ZonedDateTime</text>
	<text class="s" x="212" y="268">instant + zone + calendar</text>
	<rect class="box" x="516" y="224" width="180" height="56" rx="2"/>
	<text class="t" x="556" y="258">Instant</text>

	<line class="a" x1="332" y1="180" x2="312" y2="224"/>
	<text class="s" x="340" y="208">+ timeZone</text>
	<line class="a" x1="444" y1="252" x2="508" y2="252"/>
	<text class="s" x="448" y="242">toInstant</text>
	<line class="lossy" x1="516" y1="268" x2="416" y2="180"/>
	<text class="s" x="430" y="196">lossy without a zone</text>

	<rect class="box" x="24" y="312" width="140" height="44" rx="2"/>
	<text class="t" x="48" y="340">Duration</text>
	<text class="s" x="180" y="332">hours / minutes: exact on Instant</text>
	<text class="s" x="180" y="350">days / months: calendar on PlainDate</text>

	<text class="s" x="24" y="384">Dashed arrow = discarded information. Instant has no .month.</text>
</svg>
